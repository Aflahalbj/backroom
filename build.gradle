plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.backrooms'

base {
    archivesName = 'backrooms'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Veil (renderer yang dipakai mod aslinya) ikut dibundel di dalam jar mod ini.
jarJar.enable()

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Ekstensi VS Code (debugpy, Java Debug) kadang menempelkan dua folder ke PATH tanpa ';', mis. "c:\a\noConfigScriptsc:\b\noConfigScripts".
// Di Windows PATH jadi java.library.path, dan RenderDocker milik Veil memanggil Path.of() untuk tiap entri -> InvalidPathException saat startup.
// Jadi entri yang punya ':' selain huruf drive dibuang dari PATH proses run.
def pathEnvKey = System.getenv().keySet().find { it.equalsIgnoreCase('PATH') } ?: 'PATH'
def sanitizedPath = (System.getenv(pathEnvKey) ?: '').split(File.pathSeparator)
        .findAll { !it.isEmpty() && (File.pathSeparator != ';' || it.lastIndexOf(':') <= 1) }
        .join(File.pathSeparator)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            arg '-mixin.config=backrooms.mixins.json'
            environment pathEnvKey, sanitizedPath
        }
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // gradlew runClient -Pclienttest=true: masuk world "BackroomsTest" (dibuat kalau belum ada, lihat DevWorld), screenshot tiap level, lalu keluar.
            // gradlew runClient -Panimtest=true: buka lobby dan tunggu perintah pratinjau animasi (lihat AnimDev).
            if (project.hasProperty('animtest')) {
                property 'backrooms.animtest', 'true'
            }
            if (project.hasProperty('clienttest')) {
                property 'backrooms.clienttest', 'true'
            }
            // gradlew runClient -Pclienttest=true -Pskinwalkertest=true: uji Skinwalker saja (lihat ClientSelfTest);
            // -Pskinwalkertest=natural: pemicu alaminya, bersama fake player.
            if (project.hasProperty('skinwalkertest')) {
                property 'backrooms.skinwalkertest', project.property('skinwalkertest').toString()
            }
            mods {
                backrooms {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            // gradlew runServer -Pselftest=true: bangun keenam level, catat isinya, lalu berhenti.
            property 'backrooms.selftest', (project.findProperty('selftest') ?: 'false').toString()
            mods {
                backrooms {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared (Veil)'
        url = 'https://maven.blamejared.com'
    }
    // Advanced Fake Players (project ../fakeplayerfordev) untuk uji multipemain di dev saja; lihat dependencies.
    if (file('../fakeplayerfordev/build/libs/advfakeplayer-1.0.0.jar').exists()) {
        flatDir { dirs '../fakeplayerfordev/build/libs' }
    }
    // Player Animator, bendy-lib, TACZ, GeckoLib, dan Simple Voice Chat diambil dari Maven Modrinth.
    // (GeckoLib 4.4.9 di maven cloudsmith-nya hanya berisi source, jadi ambil jar rilisnya dari Modrinth.)
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

mixin {
    add sourceSets.main, 'backrooms.refmap.json'
    config 'backrooms.mixins.json'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Versi yang sama persis dengan yang dibundel mod aslinya (Veil 1.0.0.228).
    implementation fg.deobf('foundry.veil:Veil-forge-1.20.1:1.0.0.228')
    // Jar Veil sudah berisi molang/imgui/asm-nya sendiri; dependency transitifnya tidak ikut dibundel.
    jarJar(group: 'foundry.veil', name: 'Veil-forge-1.20.1', version: '[1.0.0.228,1.0.0.228]') {
        transitive = false
    }

    // Animasi pose lobby (format Emotecraft, dengan siku/lutut menekuk lewat bendy-lib).
    // Keduanya MIT dan dibundel, jadi pemain tidak perlu memasangnya sendiri.
    implementation fg.deobf('maven.modrinth:playeranimator:1.0.2-rc1+1.20-forge')
    implementation fg.deobf('maven.modrinth:bendy-lib:4.0.0-forge')
    jarJar(group: 'maven.modrinth', name: 'playeranimator', version: '[1.0.2-rc1,)') {
        transitive = false
        jarJar.pin(it, '1.0.2-rc1+1.20-forge')
    }
    jarJar(group: 'maven.modrinth', name: 'bendy-lib', version: '[4.0.0-forge,)') {
        transitive = false
        jarJar.pin(it, '4.0.0-forge')
    }

    // Skinwalker: GeckoLib dan Simple Voice Chat, dua-duanya dependency wajib di mod aslinya
    // (tidak dibundel, dipasang sendiri; lihat mods.toml). Dari voice chat hanya API-nya yang
    // dipakai kode ini; jar lengkapnya ikut di sini supaya runClient/runServer punya voice chat.
    implementation fg.deobf('maven.modrinth:geckolib:RBA7lJaW') // = geckolib-forge-1.20.1-4.4.9
    implementation fg.deobf('maven.modrinth:simple-voice-chat:forge-1.20.1-2.6.24')

    // Fake player (/fakeplayer spawn ...) hanya di runClient/runServer: runtimeOnly, jadi tidak ikut
    // ke jar hasil build, tidak di jarJar, dan tidak ada di mods.toml. Dilewati kalau jar-nya tidak ada.
    if (file('../fakeplayerfordev/build/libs/advfakeplayer-1.0.0.jar').exists()) {
        runtimeOnly fg.deobf('blank:advfakeplayer:1.0.0')
    }

    // TACZ hanya untuk mencoba senjata di lingkungan dev; di modpack dipasang sendiri (opsional).
    runtimeOnly fg.deobf('maven.modrinth:timeless-and-classics-zero:1.1.8-hotfix2')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : '1.20.1', minecraft_version_range: '[1.20.1,1.20.2)',
            forge_version          : '47.3.0', forge_version_range: '[47,)',
            loader_version_range   : '[47,)',
            mod_id                 : 'backrooms', mod_name: 'Backrooms Dimension',
            mod_license            : 'All Rights Reserved', mod_version: project.version,
            mod_authors            : 'User', mod_description: '''Six Backrooms dimensions built from the SP-Backrooms Revamped structure kit. /backroom gotolevel & gotoworld.'''
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties + [project: project] }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "backrooms",
                "Specification-Vendor"    : "User",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "User",
                "MixinConfigs"            : "backrooms.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

// Jar akhir = jar mod + Veil di dalamnya (jarJar), lalu di-reobf.
tasks.named('jarJar') {
    archiveClassifier = ''
}
tasks.named('jar') {
    archiveClassifier = 'slim'
}
reobf {
    jarJar {}
}
tasks.named('jarJar').configure { finalizedBy 'reobfJarJar' }

